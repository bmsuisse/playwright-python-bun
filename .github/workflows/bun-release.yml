name: Release

# Releases main whenever its version (UPSTREAM_TAG + FORK_REVISION) is not on PyPI
# yet: tests it, publishes the wheel as a GitHub release tagged
# v<upstream>-bun.<FORK_REVISION> and uploads it to PyPI as
# playwright-bun-unofficial. Runs on every push to main, so merging a change that
# bumps FORK_REVISION releases it; any other push finds the version on PyPI and
# stops after the first job. bun-sync.yml pushes with the default token, which
# starts no workflows, so it dispatches this one after merging a new upstream
# release. Dispatch it by hand to retry.
#
# PyPI uses trusted publishing: PyPI trusts this workflow file in the "pypi"
# environment, so no PyPI token is stored. If only the upload fails, re-run the
# failed jobs; the GitHub release is not created twice and a file PyPI already
# accepted is skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. GitHub keeps only one waiting run, so when pushes pile up the
# newest wins and a version that was superseded before it started is never released.
concurrency:
  group: bun-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    name: Check PyPI
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.pypi.outputs.publish }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Is this version on PyPI?
      id: pypi
      run: |
        version=$(python3 scripts/fork_version.py)
        status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/playwright-bun-unofficial/$version/json")
        case "$status" in
          200) echo "publish=false" >> "$GITHUB_OUTPUT"
               echo "::notice::$version is already on PyPI. Bump FORK_REVISION to release a new build." ;;
          404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
          *) echo "PyPI answered $status for $version"; exit 1 ;;
        esac

  test:
    needs: check
    if: needs.check.outputs.publish == 'true'
    uses: ./.github/workflows/bun-test.yml

  release:
    name: Publish release
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.10"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: wheel
        path: dist
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag=$(python scripts/fork_version.py --tag)
        version=$(python scripts/fork_version.py)
        upstream=$(cat UPSTREAM_TAG)
        # A rerun after a failed PyPI upload finds the release already there. Only
        # accept it if it is this commit: the PyPI job uploads this run's wheel.
        if gh release view "$tag" > /dev/null 2>&1; then
          released=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)
          if [ "$released" != "$GITHUB_SHA" ]; then
            echo "Release $tag was cut from $released, not $GITHUB_SHA. Re-run the failed jobs of the run that created it, or bump FORK_REVISION."
            exit 1
          fi
          echo "Release $tag already exists for this commit, not creating it again."
          exit 0
        fi
        gh release create "$tag" dist/*.whl \
          --target "$GITHUB_SHA" \
          --title "Playwright $version" \
          --notes "Playwright for Python $upstream with the driver run by the system's bun instead of a bundled Node.js. See [FORK.md](https://github.com/$GITHUB_REPOSITORY/blob/$tag/FORK.md) for installation."
        gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.url)"' >> "$GITHUB_STEP_SUMMARY"

  pypi:
    name: Upload to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/playwright-bun-unofficial/
    permissions:
      # Lets the job get the GitHub OIDC token that PyPI trusted publishing needs.
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: wheel
        path: dist
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        skip-existing: true

  report-failure:
    name: Report failure
    needs: [check, test, release, pypi]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Open an issue
      env:
        GH_TOKEN: ${{ github.token }}
      run: scripts/report_failure.sh "Release failed" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
