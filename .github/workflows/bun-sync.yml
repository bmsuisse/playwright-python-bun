name: Sync upstream

# Merges the newest upstream playwright-python release into main and starts the
# release workflow. See FORK.md. If the merge conflicts, the run fails and an
# issue is opened; resolve it locally with scripts/sync_upstream.py.
on:
  schedule:
  - cron: '23 5 * * *'
  workflow_dispatch:

concurrency:
  group: bun-sync

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        fetch-depth: 0
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.10"
    - name: Merge the latest upstream release
      id: sync
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        python scripts/sync_upstream.py
    - name: Push and start the release
      if: steps.sync.outputs.updated == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git push origin HEAD:main
        gh workflow run bun-release.yml --ref main
    - name: Open an issue
      if: ${{ failure() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: scripts/report_failure.sh "Upstream sync failed" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
