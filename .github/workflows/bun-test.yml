name: Test

# Reusable: builds the wheel and runs the tests with bun as the driver runtime.
# Called by bun-ci.yml (push / PR) and bun-release.yml (before a release is cut).
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test; the caller's ref if empty
        type: string
        default: ""
      bun-version:
        description: bun version for the test jobs (latest, canary or x.y.z)
        type: string
        default: latest

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r local-requirements.txt
        pip install -r requirements.txt
        pip install -e .
    - name: Lint
      run: pre-commit run --show-diff-on-failure --color=always --all-files

  wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.10"
    - name: Build
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel
    - name: Check the wheel is platform independent and has no Node.js
      run: |
        python - <<'PY'
        import glob, zipfile
        (wheel,) = glob.glob("dist/*.whl")
        print(wheel)
        assert wheel.endswith("-py3-none-any.whl"), "wheel must be py3-none-any"
        names = zipfile.ZipFile(wheel).namelist()
        binaries = [n for n in names if n.rsplit("/", 1)[-1] in ("node", "node.exe")]
        assert not binaries, f"Node.js binary in wheel: {binaries}"
        assert "playwright/driver/package/cli.js" in names, "driver is missing"
        PY
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wheel
        path: dist/*.whl
        if-no-files-found: error

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.suite }})
    needs: wheel
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - { python-version: '3.14', suite: full }
        - { python-version: '3.10', suite: smoke }
    # Headless chromium on Linux only: that is what the fork is for. The headed
    # tests (test_headful, page.pause) need a display and are left out.
    env:
      # pytest splits PYTEST_ADDOPTS with shell quoting rules, so -k works.
      PYTEST_ADDOPTS: >-
        --browser=chromium --timeout 90
        --ignore=tests/async/test_headful.py --ignore=tests/sync/test_headful.py
        -k "not test_page_pause"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: wheel
        path: dist
    - name: Install dependencies & browser
      run: |
        python -m pip install --upgrade pip
        pip install -r local-requirements.txt
        pip install -r requirements.txt
        pip install -e .
        python -m playwright install --with-deps --only-shell chromium
    - name: Fork tests
      run: pytest tests/test_bun_driver.py tests/test_installation.py
    - name: Common Tests
      run: pytest tests/common
    # Sync and async tests must run in separate pytest sessions.
    - name: Test Sync API
      if: matrix.suite == 'full'
      run: pytest tests/sync
    - name: Test Async API
      if: matrix.suite == 'full'
      run: pytest tests/async
